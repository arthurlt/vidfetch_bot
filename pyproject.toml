[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vidfetch_bot"
authors = [{ name = "Arthur Tucker", email = "firm.pin7067@fastmail.com" }]
description = "This bot watches messages for URLs then passes those to yt-dlp for processing and download. It then replies to the message containing the URL with the video embedded."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["TikTok", "Instagram", "YouTube", "Telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
license = "GPL-3.0"
license-files = ["LICENSE"]
dependencies = [
    "aiogram ~= 3.2",
    "yt-dlp[curl-cffi,default]>=2025.12.8",
]
dynamic = ["version"]
# version = "0.0.1"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/arthurlt/vidfetch_bot"
Issues = "https://github.com/arthurlt/vidfetch_bot/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["vidfetch_bot"]

[tool.ruff]
line-length = 120

[tool.uv]
exclude-newer = "1 week"

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    # "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
    # "D",        # 
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]

[tool.pytest.ini_options]
addopts = [
    # "--cov-fail-under=98",
    "--cov=tests",
    "--cov-report=xml:coverage.xml",
    "--cov-report=term-missing",
]
