name: CI/CD Workflow

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  checks: write
  code-quality: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7

        # for SCM versioning to work
      - name: Get history and tags
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true

      - name: "Install dependencies"
        run: uv sync --locked --all-extras --dev

      - name: "Test package"
        run: |
          uv run ty check
          uv run pytest tests --cov-report markdown-append:$GITHUB_STEP_SUMMARY

      - name: "Lint package"
        run: |
          uv run ruff check
          uv run ruff format --check
        env:
          RUFF_OUTPUT_FORMAT: "github"

      - name: "Build package"
        run: uv build

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python

  # publish-test:
  #   # if: startsWith(github.ref, 'refs/tags/') # only publish on tag pushes
  #   if: ${{ startsWith(github.ref, 'refs/tags/') }}
  #   needs:
  #     - build
  #   runs-on: ubuntu-latest

  #   environment:
  #     name: testpypi
  #     url: https://test.pypi.org/p/vidfetch_bot

  #   permissions:
  #     id-token: write

  #   steps:
  #     - name: Download artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: python-package-distributions
  #         path: dist/
  #     - name: Publish to TestPyPI
  #       uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         repository-url: https://test.pypi.org/legacy/
  #         verbose: true

  publish:
    if: startsWith(github.ref, 'refs/tags/') # only publish on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vidfetch_bot

    permissions:
      id-token: write

    steps:
      - name: "Download artifacts"
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    # if: startsWith(github.ref, 'refs/tags/') # only publish on tag pushes
    needs:
      - build
      - publish
      # - publish-test
    runs-on: ubuntu-latest
    steps:
      - name: "Get package metadata"
        uses: docker/metadata-action@v5.7.0
        id: metadata
        with:
          images: |
            ghcr.io/arthurlt/vidfetch_bot
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          build-args: |
            PACKAGE_VERSION=${{ steps.metadata.outputs.version }}
          platforms: |
            linux/amd64
            linux/arm64
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          push: true
